</style></head><body>
<div class="wrap">
  <div id="lock">
    <h1>CFB Signal — Week 1, 2026</h1>
    <p class="lk">Enter the group passcode to view the picks.</p>
    <input id="pc" type="password" placeholder="Passcode" autocomplete="off">
    <button id="go" onclick="unlock()">Unlock</button>
    <div id="err" class="lke"></div>
  </div>
  <div id="content"></div>
</div>
<script>
  let ENC = null;
  const DATA_URL = "https://satchelpig.github.io/cfb-data/enc.json";

  const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const te = new TextEncoder();
  const cat = (a,b)=>{const c=new Uint8Array(a.length+b.length);c.set(a);c.set(b,a.length);return c;};
  const sha256 = async u => new Uint8Array(await crypto.subtle.digest('SHA-256', u));
  const hex = u => [...u].map(x=>x.toString(16).padStart(2,'0')).join('');
  async function derive(pass){
    const km = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:b64d(ENC.salt), iterations:ENC.iters}, km, 256);
    return new Uint8Array(bits);
  }
  async function tryDecrypt(pass){
    const key = await derive(pass);
    if(hex(await sha256(cat(key, te.encode('verify')))) !== ENC.verify) return null;
    const ct = b64d(ENC.ct); let ks = new Uint8Array(0), i = 0;
    while(ks.length < ct.length){ const ctr=new Uint8Array(4); new DataView(ctr.buffer).setUint32(0,i,false); ks=cat(ks, await sha256(cat(key,ctr))); i++; }
    const pt = new Uint8Array(ct.length); for(let j=0;j<ct.length;j++) pt[j]=ct[j]^ks[j];
    return new TextDecoder('utf-8').decode(pt);
  }
  function inject(str){
    if(window.__cfbInjected) return;   // idempotent: never re-run scripts (avoids re-declaring GAMES)
    window.__cfbInjected = true;
    const c = document.getElementById('content'); c.innerHTML = str;
    c.querySelectorAll('script').forEach(o=>{const s=document.createElement('script'); s.textContent=o.textContent; o.replaceWith(s);});
    document.getElementById('lock').style.display='none';
  }
  async function unlock(){
    const p = document.getElementById('pc').value.trim();
    const r = await tryDecrypt(p);
    if(r){ try{localStorage.setItem('cfbpc', p);}catch(e){} inject(r); }
    else { document.getElementById('err').textContent = 'Wrong passcode — try again.'; }
  }

  window.addEventListener('DOMContentLoaded', async ()=>{
    const err = document.getElementById('err');
    try {
      const u = DATA_URL + (DATA_URL.indexOf('?')>=0?'&':'?') + 't=' + Date.now();
      const r = await fetch(u, {cache:'no-store'});
      if(!r.ok) throw new Error('http '+r.status);
      ENC = await r.json();
    } catch(e){ if(err) err.textContent = 'Could not load the latest picks (network?). Refresh to retry.'; return; }
    document.getElementById('pc').addEventListener('keydown', e=>{ if(e.key==='Enter') unlock(); });
    let p; try{p=localStorage.getItem('cfbpc');}catch(e){}
    if(p){ const rr=await tryDecrypt(p); if(rr) inject(rr); }
  });

</script>
